name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # yahoo-finance2 requires Node >= 22.
          node-version: 22
          cache: npm

      - run: npm ci

      # No secrets are needed: the test suite never calls the model, the
      # database, or a market-data endpoint. A build does not either — every
      # page that reads data is dynamic, so nothing is fetched at build time.

      # `next typegen` first, not decoration: Next generates the global
      # `PageProps`/`LayoutProps`/`RouteContext` helpers into `.next/types/`
      # (plus `next-env.d.ts`, which references them). Locally those exist
      # because `next dev` has run; a clean CI checkout has no `.next/`, so a
      # bare `tsc --noEmit` fails with "Cannot find name 'LayoutProps'".
      # See node_modules/next/dist/docs/01-app/03-api-reference/06-cli/next.md.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
