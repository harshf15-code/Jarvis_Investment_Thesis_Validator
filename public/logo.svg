<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Jarvis">
  <title>Jarvis</title>
  <defs>
    <radialGradient id="jv-glow" cx="50%" cy="50%" r="50%">
      <stop offset="35%" stop-color="#c6e315" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#c6e315" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c6e315" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="80" cy="80" r="78" fill="url(#jv-glow)"/>
