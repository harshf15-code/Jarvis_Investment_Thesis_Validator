  <path d="M80 14 L49.5 80 L80 146 Z"          fill="#cbe817"/>
  <path d="M80 14 L80 146 L110.5 80 Z"         fill="#bedc04"/>
  <path d="M80 14 L110.5 80 L80 146 L132.5 80 Z" fill="#acc705"/>
</svg>
